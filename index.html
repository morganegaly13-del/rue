<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Murviel — Toutes les rues</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
#map{position:absolute;inset:0}
.panel{position:fixed;z-index:1000;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.96);border-radius:18px;padding:12px;box-shadow:0 4px 24px rgba(0,0,0,.20)}
.title{font-size:19px;font-weight:800}.sub{font-size:12px;color:#667085;margin-top:2px}
.stats{display:flex;gap:7px;margin-top:9px}.stat{flex:1;background:#f2f4f7;border-radius:11px;padding:7px;text-align:center}.num{font-size:17px;font-weight:800}.lbl{font-size:10px;color:#667085}
.progress{height:8px;background:#e4e7ec;border-radius:99px;margin-top:9px;overflow:hidden}.bar{height:100%;width:0;background:#16a34a;transition:width .25s}
.buttons{display:flex;gap:7px;margin-top:9px}.btn{flex:1;border:0;border-radius:11px;padding:11px;font-weight:750;background:#111827;color:white}.btn.secondary{background:#e4e7ec;color:#111827}
#msg{font-size:12px;color:#475467;margin-top:7px;line-height:1.25;min-height:15px}
.legend{position:fixed;z-index:999;bottom:max(12px,env(safe-area-inset-bottom));left:10px;background:rgba(255,255,255,.94);border-radius:13px;padding:8px 10px;font-size:11px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="title">Murviel-lès-Béziers</div>
  <div class="sub">Toutes les rues — V2</div>
  <div class="stats">
    <div class="stat"><div class="num" id="done">0</div><div class="lbl">segments faits</div></div>
    <div class="stat"><div class="num" id="total">—</div><div class="lbl">segments</div></div>
    <div class="stat"><div class="num" id="pct">0%</div><div class="lbl">progression</div></div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="buttons">
    <button class="btn" id="gps">Démarrer GPS</button>
    <button class="btn secondary" id="reset">Réinitialiser</button>
  </div>
  <div id="msg">Chargement des rues…</div>
</div>
<div class="legend">🔴 à faire &nbsp; 🟢 parcouru &nbsp; 🔵 position</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTER=[43.4401,3.14368];
const STORAGE="murviel-rues-v2";
const OVERPASS=[
 "https://overpass-api.de/api/interpreter",
 "https://overpass.kumi.systems/api/interpreter",
 "https://overpass.private.coffee/api/interpreter"
];

const map=L.map("map",{zoomControl:false}).setView(CENTER,14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:20,attribution:"© OpenStreetMap contributors"
}).addTo(map);
L.control.zoom({position:"bottomright"}).addTo(map);

let segments=[], layers=[], done=new Set(), watchId=null, userMarker=null, accuracyCircle=null;
try{done=new Set(JSON.parse(localStorage.getItem(STORAGE)||"[]"))}catch(e){}

function save(){localStorage.setItem(STORAGE,JSON.stringify([...done]));updateUI()}
function updateUI(){
 const t=segments.length,d=done.size,p=t?Math.round(d/t*100):0;
 document.getElementById("done").textContent=d;
 document.getElementById("total").textContent=t||"—";
 document.getElementById("pct").textContent=p+"%";
 document.getElementById("bar").style.width=p+"%";
}
function msg(s){document.getElementById("msg").textContent=s}
function segmentId(w,i){return String(w.id)+"-"+i}

function addWay(w){
 if(!w.geometry || w.geometry.length<2 || !w.tags || !w.tags.name)return;
 for(let i=0;i<w.geometry.length-1;i++){
   const a=w.geometry[i],b=w.geometry[i+1];
   const id=segmentId(w,i);
   const data={id,name:w.tags.name,coords:[[a.lat,a.lon],[b.lat,b.lon]]};
   segments.push(data);
   const line=L.polyline(data.coords,{
     color:done.has(id)?"#16a34a":"#ef4444",weight:5,opacity:.72
   }).addTo(map);
   line.on("click",()=>{
     if(done.has(id))done.delete(id);else done.add(id);
     line.setStyle({color:done.has(id)?"#16a34a":"#ef4444"});
     save();
     msg((done.has(id)?"Rue/portion validée : ":"Rue/portion remise à faire : ")+data.name);
   });
   layers.push({id,name:data.name,line,coords:data.coords});
 }
}

async function getOverpass(url){
 const query=`[out:json][timeout:45];
 area["name"="Murviel-lès-Béziers"]["boundary"="administrative"]->.searchArea;
 way(area.searchArea)["highway"]["name"];
 out tags geom;`;
 const r=await fetch(url+"?data="+encodeURIComponent(query),{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 return await r.json();
}

async function loadStreets(){
 msg("Recherche du réseau routier de Murviel-lès-Béziers…");
 let data=null,lastErr=null;
 for(const endpoint of OVERPASS){
   try{data=await getOverpass(endpoint);if(data.elements?.length)break}
   catch(e){lastErr=e}
 }
 if(!data || !data.elements?.length){
   msg("Le serveur cartographique ne répond pas. Recharge la page dans quelques minutes.");
   return;
 }
 const ways=data.elements.filter(w=>w.tags?.name&&w.geometry?.length>1);
 ways.forEach(addWay);
 updateUI();
 if(layers.length){
   const group=L.featureGroup(layers.map(x=>x.line));
   map.fitBounds(group.getBounds().pad(.04));
 }
 msg(layers.length+" portions de rues chargées. Appuie sur « Démarrer GPS ».");
}

function startGPS(){
 if(!navigator.geolocation){msg("La géolocalisation n'est pas disponible sur cet appareil.");return}
 if(watchId!==null){
   navigator.geolocation.clearWatch(watchId);watchId=null;
   document.getElementById("gps").textContent="Démarrer GPS";
   msg("GPS arrêté.");
   return;
 }
 document.getElementById("gps").textContent="Arrêter GPS";
 msg("Demande d'autorisation GPS…");
 watchId=navigator.geolocation.watchPosition(pos=>{
   const {latitude,longitude,accuracy}=pos.coords,p=[latitude,longitude];
   if(!userMarker){
     userMarker=L.circleMarker(p,{radius:8,color:"#fff",weight:3,fillColor:"#2563eb",fillOpacity:1}).addTo(map);
     accuracyCircle=L.circle(p,{radius:accuracy,color:"#2563eb",fillOpacity:.08,weight:1}).addTo(map);
     map.setView(p,17);
   }else{
     userMarker.setLatLng(p);
     accuracyCircle.setLatLng(p).setRadius(accuracy);
   }
   msg("GPS actif — précision ±"+Math.round(accuracy)+" m");
   detectSegments(p);
 },err=>{
   msg("GPS : "+err.message+" — vérifie l'autorisation de localisation dans Safari.");
 },{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}

function pointSegmentDistance(p,a,b){
 const lat=p[0]*Math.PI/180, cos=Math.cos(lat);
 const x1=a[1]*cos,y1=a[0],x2=b[1]*cos,y2=b[0],px=p[1]*cos,py=p[0];
 const dx=x2-x1,dy=y2-y1;
 const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1)));
 const x=x1+t*dx,y=y1+t*dy;
 const dLat=(py-y)*111320,dLon=(px-x)*111320;
 return Math.sqrt(dLat*dLat+dLon*dLon);
}

function detectSegments(p){
 let count=0;
 for(const s of layers){
   if(done.has(s.id))continue;
   const d=pointSegmentDistance(p,s.coords[0],s.coords[1]);
   if(d<10){
     done.add(s.id);s.line.setStyle({color:"#16a34a"});count++;
   }
 }
 if(count){save();msg(count+" portion(s) de rue parcourue(s) détectée(s).")}
}

document.getElementById("gps").onclick=startGPS;
document.getElementById("reset").onclick=()=>{
 if(confirm("Effacer toute la progression ?")){
   done.clear();save();
   layers.forEach(s=>s.line.setStyle({color:"#ef4444"}));
   msg("Progression réinitialisée.");
 }
};
loadStreets();
</script>
</body>
</html>
